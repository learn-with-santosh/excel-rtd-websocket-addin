[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxll-rtd-server"
version = "0.1.0"
description = "PyXLL RTD topics backed by the repository WebSocket market-data server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websocket-client>=1.8",
]

[project.optional-dependencies]
pyxll = ["pyxll>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
